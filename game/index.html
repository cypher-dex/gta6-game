<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marisol Bay — an open-world crime story</title>
<link rel="stylesheet" href="./src/style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="view" aria-label="Marisol Bay game view"></canvas>
<div id="hud" class="hidden">
  <div id="hud-mission"><div id="hud-mission-title"></div><div id="hud-objective"></div><div id="hud-timer"></div></div>
  <div id="hud-status">
    <div id="hud-weapon"><span id="hud-weapon-name"></span><span id="hud-ammo"></span></div>
    <div id="hud-money">$0</div>
    <div id="hud-stars"></div>
  </div>
  <div id="hud-map-wrap"><canvas id="hud-minimap" width="440" height="440"></canvas><div id="hud-bars"><div id="hud-health"><i></i></div><div id="hud-armor"><i></i></div></div></div>
  <div id="hud-location"><div id="hud-district"></div><div id="hud-vehicle"></div></div>
  <div id="hud-radio"></div>
  <div id="hud-subtitle"></div>
  <div id="hud-toast"></div>
  <div id="hud-crosshair"></div>
  <div id="hud-big"></div>
</div>
<div id="menu" class="hidden"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
